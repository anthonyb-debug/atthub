<div id="root"><div id="boot">Loading Attendance Tracker…</div></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* =========================================================================
   ATTENDANCE TRACKER
   Tracker columns: Names · Date · Day · Campaign · Shift · Scheduled · Absent ·
   Tardy · Early Out · Leave · OT · Minutes.
   Scheduled (shown as a check) and Minutes are auto-calculated from the shift
   string and the deduction minutes. Leave is planned/credited and does not
   reduce Minutes; Absent/Tardy/Early Out do.
   ========================================================================= */

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const PALETTE = ["#2563EB", "#C08A2D", "#5A54C9", "#B23A3A", "#2C7BB6", "#8E44AD", "#16A085", "#D35400"];
const EMPTY_ROWS = [];
const EMPTY_MAP = new Map();
const monthOf = (r) => { const s = r && r.date; if (!s) return { year: "", month: "" }; const p = String(s).split("-"); return p.length === 3 ? { year: +p[0], month: MONTHS[+p[1] - 1] } : { year: "", month: "" }; };

const num = (x) => { const n = parseFloat(x); return isNaN(n) ? 0 : n; };

/* parse "9:00PM", "6:00 AM", "22:00" -> minutes from midnight */
function parseT(x) {
  if (x == null) return null;
  let s = String(x).replace(/\s+/g, "").toUpperCase();
  const m = s.match(/^(\d{1,2}):(\d{2})(AM|PM)?$/);
  if (!m) return null;
  let h = +m[1]; const mm = +m[2]; const ap = m[3];
  if (ap === "AM") { if (h === 12) h = 0; }
  else if (ap === "PM") { if (h !== 12) h += 12; }
  if (h > 23 || mm > 59) return null;
  return h * 60 + mm;
}

/* scheduled working minutes from a shift string (duration minus break) */
function schedMin(shift) {
  if (!shift) return null;
  const s = String(shift).trim();
  if (!s || /off/i.test(s) || /not\s*yet\s*hired/i.test(s)) return null;
  const idx = s.indexOf("-");
  if (idx < 0) return null;
  const a = parseT(s.slice(0, idx)), b = parseT(s.slice(idx + 1));
  if (a == null || b == null) return null;
  const dur = (((b - a) % 1440) + 1440) % 1440;
  if (dur <= 0 || dur > 960) return null; // 0-length or absurd (>16h) shift -> flagged as "check shift"
  const brk = dur >= 720 ? 120 : 60;
  return dur - brk;
}

function derive(r) {
  const d = r.date ? new Date(r.date + "T00:00:00") : null;
  const valid = d && !isNaN(d.getTime());
  const sched = schedMin(r.shift);
  const ded = num(r.absent) + num(r.tardy) + num(r.earlyout); // Leave is planned/credited, not deducted
  const minutes = sched == null ? null : sched - ded;
  const sh = String(r.shift || "").trim();
  const schedBad = !!(sh && sched == null && !/off/i.test(sh) && !/not\s*yet\s*hired/i.test(sh));
  return {
    year: valid ? d.getFullYear() : "",
    month: valid ? MONTHS[d.getMonth()] : "",
    day: valid ? DAYS[d.getDay()] : "",
    sched, ded, minutes, schedBad,
  };
}

/* Build each agent's usual shift per weekday (captures rest days & rotations) */
function buildProfiles(src) {
  const P = {};
  src.forEach((r) => {
    const name = (r.name || "").trim();
    if (!name) return;
    const wd = r.date ? new Date(r.date + "T00:00:00").getDay() : null;
    P[name] = P[name] || { name, campC: {}, wd: [{}, {}, {}, {}, {}, {}, {}], shiftC: {} };
    const p = P[name];
    if (r.campaign) p.campC[r.campaign] = (p.campC[r.campaign] || 0) + 1;
    const sh = (r.shift || "").trim();
    if (wd != null) p.wd[wd][sh] = (p.wd[wd][sh] || 0) + 1;
    if (sh && !/off/i.test(sh) && !/not\s*yet\s*hired/i.test(sh)) p.shiftC[sh] = (p.shiftC[sh] || 0) + 1;
  });
  const top = (o) => { let bk = null, bv = -1; for (const k in o) { if (o[k] > bv) { bv = o[k]; bk = k; } } return bk; };
  const out = {};
  Object.values(P).forEach((p) => {
    out[p.name] = { name: p.name, campaign: top(p.campC) || "", weekday: p.wd.map((o) => (Object.keys(o).length ? top(o) : null)), fallback: top(p.shiftC) || "" };
  });
  return out;
}

const DEFAULT_GS_URL = "https://script.google.com/macros/s/AKfycbw92HPvI9lODOkr2NTQRyrIIArxtXpLxJ8A5JdcaVZRNppd6t_uxLMEdBIt7gQ2yPz3zg/exec";

const APPS_SCRIPT = `/** Attendance Tracker sync — paste into Extensions > Apps Script,
 *  Deploy > New deployment > Web app. Execute as: Me. Access: Anyone.
 *  Then paste the Web app URL into the tracker. */
function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  writeTab(ss, "Attendance", data.rows || []);
  writeState(ss, "_state", data.state || []);
  return ContentService.createTextOutput("ok");
}
function writeTab(ss, name, rows) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  sh.clearContents();
  if (!rows.length) return;
  var order = [];
  rows.forEach(function (r) { Object.keys(r).forEach(function (k) { if (order.indexOf(k) < 0) order.push(k); }); });
  var values = [order].concat(rows.map(function (r) { return order.map(function (k) { return r[k] === undefined ? "" : r[k]; }); }));
  sh.getRange(1, 1, values.length, order.length).setValues(values);
  sh.setFrozenRows(1);
}
function writeState(ss, name, rows) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  sh.clearContents();
  var values = [["json"]].concat(rows.map(function (r) { return [r.json]; }));
  sh.getRange(1, 1, values.length, 1).setValues(values);
  try { sh.hideSheet(); } catch (err) {}
}
function doGet(e) {
  var cb = (e.parameter && e.parameter.callback) || "callback";
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("_state");
  var out = [];
  if (sh) { var v = sh.getDataRange().getValues(); for (var i = 1; i < v.length; i++) if (v[i][0]) out.push(v[i][0]); }
  return ContentService.createTextOutput(cb + "(" + JSON.stringify(out) + ")").setMimeType(ContentService.MimeType.JAVASCRIPT);
}`;

const GKEY = "attendance:rows";
function loadRows() { try { const r = localStorage.getItem(GKEY); return r ? JSON.parse(r) : []; } catch { return []; } }
function saveRows(rows) { try { localStorage.setItem(GKEY, JSON.stringify(rows)); } catch (e) { console.error(e); } }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const todayYMD = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const mins = (x) => (x == null ? "" : Math.round(x));
const fmtMDY = (ymd) => { if (!ymd) return ""; const p = String(ymd).split("-"); return p.length === 3 ? p[1] + "/" + p[2] + "/" + p[0] : String(ymd); };

function AttendanceApp() {
  const [view, setView] = useState("tracker");
  const [rows, setRows] = useState([]);
  const [toast, setToast] = useState(null);
  const fileRef = useRef();
  const edited = useRef(false);
  const saveTimer = useRef();
  const rowsRef = useRef([]);
  const [gsUrl, setGsUrl] = useState("");
  const [gsDraft, setGsDraft] = useState("");
  const [syncStatus, setSyncStatus] = useState("idle");
  const [lastSync, setLastSync] = useState(null);
  const [showSync, setShowSync] = useState(false);
  const syncTimer = useRef();

  // tracker filters
  const [fMonth, setFMonth] = useState("all");
  const [fCampaign, setFCampaign] = useState("all");
  const [fYear, setFYear] = useState("all");
  const [fDate, setFDate] = useState("");
  const [fAgent, setFAgent] = useState("all");
  const flashRef = useRef();
  const didInit = useRef(false);
  const [selected, setSelected] = useState(() => new Set());
  const [showAgent, setShowAgent] = useState(null);

  // dashboard filters
  const [dMonth, setDMonth] = useState("all");
  const [dYear, setDYear] = useState("all");
  const [dCampaign, setDCampaign] = useState("all");
  const [dAgent, setDAgent] = useState("all");
  const [dSortKey, setDSortKey] = useState("attendance");
  const [dSortDir, setDSortDir] = useState("desc");
  const [showGen, setShowGen] = useState(false);
  const [showBatch, setShowBatch] = useState(false);
  const [batchShift, setBatchShift] = useState("");
  const [batchCampaign, setBatchCampaign] = useState("");
  const [genMonth, setGenMonth] = useState(MONTHS[0]);
  const [genYear, setGenYear] = useState(String(new Date().getFullYear()));
  const [genCampaign, setGenCampaign] = useState("all");
  const [genSource, setGenSource] = useState("all");
  const [genSkip, setGenSkip] = useState(true);

  // new agent modal
  const [showNewAgent, setShowNewAgent] = useState(false);
  const [naName, setNaName] = useState("");
  const [naCampaign, setNaCampaign] = useState("");
  const [naMonth, setNaMonth] = useState(MONTHS[0]);
  const [naYear, setNaYear] = useState(String(new Date().getFullYear()));
  const [naShift, setNaShift] = useState("");
  const [naRest, setNaRest] = useState([0, 6]);

  useEffect(() => { setRows(loadRows()); const u = localStorage.getItem("attendance:gsurl") || DEFAULT_GS_URL; setGsUrl(u); setGsDraft(u); }, []);
  useEffect(() => { setSelected(new Set()); }, [fMonth, fYear, fCampaign, fAgent, fDate]);
  useEffect(() => { const flush = () => { clearTimeout(saveTimer.current); try { localStorage.setItem(GKEY, JSON.stringify(rowsRef.current)); } catch (e) {} }; window.addEventListener("beforeunload", flush); return () => window.removeEventListener("beforeunload", flush); }, []);
  useEffect(() => {
    if (didInit.current || !rows.length) return;
    let best = null;
    rows.forEach((r) => { const d = monthOf(r); if (d.month && d.year !== "") { const k = d.year * 100 + MONTHS.indexOf(d.month); if (!best || k > best.k) best = { k, month: d.month, year: String(d.year) }; } });
    if (best) { setFMonth(best.month); setFYear(best.year); }
    didInit.current = true;
  }, [rows]);
  const flash = (m) => { const o = typeof m === "string" ? { msg: m } : m; setToast(o); clearTimeout(flashRef.current); flashRef.current = setTimeout(() => setToast(null), o.fn ? 6000 : 2400); };
  const commit = (next) => { edited.current = true; rowsRef.current = next; setRows(next); clearTimeout(saveTimer.current); saveTimer.current = setTimeout(() => saveRows(next), 400); };

  const campaigns = useMemo(() => Array.from(new Set(rows.map((r) => (r.campaign || "").trim()).filter(Boolean))).sort(), [rows]);
  const campColor = (c) => PALETTE[(campaigns.indexOf(c) + PALETTE.length) % PALETTE.length];
  const derivedById = useMemo(() => { if (view !== "dashboard") return EMPTY_MAP; const m = new Map(); rows.forEach((r) => m.set(r.id, derive(r))); return m; }, [rows, view]);
  const dOf = (r) => derivedById.get(r.id) || derive(r);
  const yearsList = useMemo(() => Array.from(new Set(rows.map((r) => String(monthOf(r).year)).filter((y) => y && y !== ""))).sort().reverse(), [rows]);
  const monthsAvailable = useMemo(() => {
    const m = new Map();
    rows.forEach((r) => { const d = monthOf(r); if (d.month && d.year) m.set(d.month + " " + d.year, { key: d.month + " " + d.year, month: d.month, year: String(d.year) }); });
    return Array.from(m.values()).sort((a, b) => (b.year - a.year) || (MONTHS.indexOf(b.month) - MONTHS.indexOf(a.month)));
  }, [rows]);

  const openGen = () => {
    const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + 1);
    setGenMonth(MONTHS[base.getMonth()]); setGenYear(String(base.getFullYear()));
    setGenCampaign("all"); setGenSource(monthsAvailable[0] ? monthsAvailable[0].key : "all"); setGenSkip(true);
    setShowGen(true);
  };
  const generate = () => {
    const mi = MONTHS.indexOf(genMonth); const y = parseInt(genYear, 10);
    if (mi < 0 || !y) return flash("Pick a valid month and year");
    let srcRows = rows;
    if (genSource !== "all") { const sm = genSource.slice(0, genSource.lastIndexOf(" ")); const sy = genSource.slice(genSource.lastIndexOf(" ") + 1); srcRows = rows.filter((r) => { const d = monthOf(r); return d.month === sm && String(d.year) === sy; }); }
    const profiles = buildProfiles(srcRows.length ? srcRows : rows);
    let agents = Object.values(profiles);
    if (genCampaign !== "all") agents = agents.filter((p) => p.campaign === genCampaign);
    if (!agents.length) return flash("No agents found to generate from");
    const dim = new Date(y, mi + 1, 0).getDate();
    const existing = new Set(rows.map((r) => (r.name || "").toLowerCase() + "|" + r.date));
    const out = [];
    agents.forEach((p) => {
      for (let day = 1; day <= dim; day++) {
        const date = y + "-" + String(mi + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
        if (genSkip && existing.has(p.name.toLowerCase() + "|" + date)) continue;
        const wd = new Date(date + "T00:00:00").getDay();
        const shift = p.weekday[wd] && p.weekday[wd] !== "" ? p.weekday[wd] : (p.fallback || "");
        out.push({ id: uid(), date, shift, campaign: p.campaign, name: p.name, absent: "", tardy: "", earlyout: "", leave: "", leaveType: "", ot: "" });
      }
    });
    if (!out.length) return flash("Nothing to add — those rows already exist");
    commit([...rows, ...out]);
    setShowGen(false); setFMonth(genMonth); setFYear(String(y)); setView("tracker");
    flash("Generated " + out.length + " rows for " + genMonth + " " + y);
  };

  const openNewAgent = () => {
    const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + 1);
    setNaName(""); setNaCampaign(fCampaign !== "all" ? fCampaign : "");
    setNaMonth(MONTHS[base.getMonth()]); setNaYear(String(base.getFullYear()));
    setNaShift(""); setNaRest([0, 6]);
    setShowNewAgent(true);
  };
  const addNewAgent = () => {
    const name = naName.trim();
    if (!name) return flash("Enter the agent's name");
    const mi = MONTHS.indexOf(naMonth); const y = parseInt(naYear, 10);
    if (mi < 0 || !y) return flash("Pick a valid month and year");
    if (!naShift) return flash("Pick the working shift");
    const dim = new Date(y, mi + 1, 0).getDate();
    const existing = new Set(rows.map((r) => (r.name || "").toLowerCase() + "|" + r.date));
    const out = [];
    for (let day = 1; day <= dim; day++) {
      const date = y + "-" + String(mi + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
      if (existing.has(name.toLowerCase() + "|" + date)) continue;
      const wd = new Date(date + "T00:00:00").getDay();
      const shift = naRest.includes(wd) ? "OFF" : naShift;
      out.push({ id: uid(), date, shift, campaign: naCampaign, name, absent: "", tardy: "", earlyout: "", leave: "", leaveType: "", ot: "" });
    }
    if (!out.length) return flash("Nothing to add — those rows already exist");
    commit([...rows, ...out]);
    setShowNewAgent(false); setFMonth(naMonth); setFYear(String(y)); setFAgent(name); setView("tracker");
    flash("Added " + out.length + " rows for " + name + " — " + naMonth + " " + y);
  };

  /* ---------- tracker ---------- */
  const trackerRows = useMemo(() => rows.filter((r) => {
    const dv = monthOf(r);
    const agentOk = fAgent === "all" || (r.name || "") === fAgent;
    const campOk = fCampaign === "all" || (r.campaign || "") === fCampaign;
    if (fDate) return r.date === fDate && campOk && agentOk;
    return (fMonth === "all" || dv.month === fMonth) && (fYear === "all" || String(dv.year) === String(fYear)) && campOk && agentOk;
  }).sort((a, b) => {
    const da = a.date || "9999-99-99", db = b.date || "9999-99-99";
    if (da !== db) return da < db ? -1 : 1;
    return (a.name || "").localeCompare(b.name || "");
  }), [rows, fMonth, fYear, fCampaign, fAgent, fDate]);

  const addRow = () => {
    const name = (window.prompt("Agent name (Last, First):", "") || "").trim();
    commit([...rows, { id: uid(), date: fDate || todayYMD(), shift: "", campaign: fCampaign === "all" ? "" : fCampaign, name, absent: "", tardy: "", earlyout: "", leave: "", leaveType: "", ot: "" }]);
  };
  const setCell = (id, k, v) => commit(rows.map((r) => (r.id === id ? { ...r, [k]: v } : r)));
  const delRow = (id) => {
    const row = rows.find((r) => r.id === id);
    commit(rows.filter((r) => r.id !== id));
    if (row) flash({ msg: "Row deleted", actionLabel: "Undo", fn: () => setRows((prev) => { const n = [...prev, row]; saveRows(n); return n; }) });
  };
  const toggleSelect = (id) => setSelected((prev) => { const n = new Set(prev); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  const toggleSelectAll = () => setSelected((prev) => {
    const ids = trackerRows.slice(0, CAP).map((r) => r.id);
    const allSelected = ids.length > 0 && ids.every((id) => prev.has(id));
    return allSelected ? new Set() : new Set(ids);
  });
  const delSelected = () => {
    if (!selected.size) return;
    const ids = selected;
    const removed = rows.filter((r) => ids.has(r.id));
    commit(rows.filter((r) => !ids.has(r.id)));
    setSelected(new Set());
    flash({ msg: removed.length + " row" + (removed.length === 1 ? "" : "s") + " deleted", actionLabel: "Undo", fn: () => setRows((prev) => { const n = [...prev, ...removed]; saveRows(n); return n; }) });
  };
  const applyBatch = () => {
    if (!selected.size) return;
    if (!batchShift && !batchCampaign) { setShowBatch(false); return; }
    commit(rows.map((r) => (selected.has(r.id) ? { ...r, shift: batchShift || r.shift, campaign: batchCampaign || r.campaign } : r)));
    const n = selected.size;
    setShowBatch(false); setSelected(new Set());
    flash(n + " row" + (n === 1 ? "" : "s") + " updated");
  };
  const markSelected = (kind) => {
    if (!selected.size) return;
    commit(rows.map((r) => {
      if (!selected.has(r.id)) return r;
      if (kind === "off") return { ...r, shift: "OFF", absent: "", leave: "", tardy: "", earlyout: "", ot: "" };
      if (kind === "clear") return { ...r, absent: "", leave: "", tardy: "", earlyout: "", ot: "" };
      const s = schedMin(r.shift);
      if (s == null) return r;
      if (kind === "absent") return { ...r, absent: String(s), leave: "" };
      if (kind === "leave") return { ...r, leave: String(s), absent: "" };
      return r;
    }));
    const n = selected.size; setSelected(new Set());
    flash(n + " row" + (n === 1 ? "" : "s") + " updated");
  };
  const onCellKey = (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const td = e.target.closest("td"), tr = e.target.closest("tr");
    if (!td || !tr) return;
    const idx = Array.prototype.indexOf.call(tr.children, td);
    let nx = tr.nextElementSibling;
    while (nx) { const cell = nx.children[idx]; const inp = cell && cell.querySelector("input:not([type=checkbox])"); if (inp) { inp.focus(); if (inp.select) inp.select(); break; } nx = nx.nextElementSibling; }
  };
  const clearAll = () => {
    if (!rows.length) return;
    if (window.confirm("Delete ALL " + rows.length + " row(s) from this device? This cannot be undone — export or sync first if unsure.")) { commit([]); setSelected(new Set()); flash("All data cleared"); }
  };

  /* ---------- export / import ---------- */
  const exportXLSX = () => {
    if (!rows.length) return flash("Nothing to export yet");
    const data = rows.map((r) => {
      const d = dOf(r);
      return {
        Year: d.year, Month: d.month, Date: r.date || "", Day: d.day, Shift: r.shift || "",
        Campaign: r.campaign || "", Names: r.name || "", Scheduled: d.sched == null ? "" : d.sched,
        Absent: r.absent || "", Tardy: r.tardy || "", "Early Out": r.earlyout || "", Leave: r.leave || "",
        OT: r.ot || "", Minutes: d.minutes == null ? "" : d.minutes,
      };
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Attendance");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.map((r) => ({ json: JSON.stringify(r) }))), "_backup");
    XLSX.writeFile(wb, `Attendance_${todayYMD()}.xlsx`);
    flash(`Exported ${rows.length} row(s)`);
  };

  const _pad2 = (n) => String(n).padStart(2, "0");
  const _ymdLocal = (d) => d.getFullYear() + "-" + _pad2(d.getMonth() + 1) + "-" + _pad2(d.getDate());
  const toYMD = (v) => {
    if (v == null || v === "") return "";
    // Excel Date objects (cellDates) are at local midnight — read local parts, never toISOString (that shifts the day by the timezone offset)
    if (v instanceof Date) return isNaN(v) ? "" : _ymdLocal(v);
    // Excel serial number -> calendar date via UTC epoch (timezone-independent)
    if (typeof v === "number") { const d = new Date(Math.round((v - 25569) * 86400 * 1000)); return isNaN(d) ? "" : d.toISOString().slice(0, 10); }
    const s = String(v).trim();
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + "-" + _pad2(+m[2]) + "-" + _pad2(+m[3]);

    const d = new Date(s); return isNaN(d) ? s : _ymdLocal(d);
  };
  const importXLSX = async (file) => {
    try {
      const wb = XLSX.read(await file.arrayBuffer());

        const imported = XLSX.utils.sheet_to_json(wb.Sheets["_backup"]).map((r) => JSON.parse(r.json));

        commit(Array.from(byId.values()));
        return flash(`Imported ${imported.length} row(s) from backup`);
      }
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { defval: "" });
      const pick = (o, keys) => { for (const k of Object.keys(o)) { const kn = k.toLowerCase().trim(); if (keys.includes(kn)) return o[k]; } return ""; };
      const imported = raw.map((o) => ({
        id: uid(),

        earlyout: pick(o, ["early out", "earlyout"]), leave: pick(o, ["leave"]),

      })).filter((r) => r.name || r.shift || r.date);
      const seen = new Set(rows.map((r) => (r.name || "").toLowerCase() + "|" + r.date));
      const merged = [...rows]; let added = 0;
      imported.forEach((r) => { const k = (r.name || "").toLowerCase() + "|" + r.date; if (seen.has(k)) return; seen.add(k); merged.push(r); added++; });

      {/* header */}

      {showBatch && (
        <div onClick={() => setShowBatch(false)} style={{ position: "fixed", inset: 0, background: "rgba(20,26,38,.5)", zIndex: 60, display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "48px 16px", overflowY: "auto" }}>
          <div onClick={(ev) => ev.stopPropagation()} style={{ background: "#fff", borderRadius: 12, maxWidth: 460, width: "100%", padding: 22, boxShadow: "0 20px 60px rgba(0,0,0,.3)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 17, fontWeight: 800 }}>Batch edit schedule</div>
              <button onClick={() => setShowBatch(false)} style={{ border: "none", background: "none", fontSize: 20, color: "#8A93A6", cursor: "pointer" }}>{"\u00d7"}</button>
            </div>
            <div style={{ fontSize: 13, color: "#4A5264", lineHeight: 1.55, marginBottom: 14 }}>Apply to the <b>{selected.size}</b> selected row(s). Leave a field on \u201cKeep current\u201d to not change it.</div>
            <div style={{ marginBottom: 12 }}><div style={lbl}>Shift</div><select style={{ ...SEL, width: "100%" }} value={batchShift} onChange={(e) => setBatchShift(e.target.value)}><option value="">Keep current</option>{shiftOptions.map((s) => <option key={s} value={s}>{s}</option>)}</select></div>
            <div><div style={lbl}>Campaign</div><select style={{ ...SEL, width: "100%" }} value={batchCampaign} onChange={(e) => setBatchCampaign(e.target.value)}><option value="">Keep current</option>{campaigns.map((c) => <option key={c} value={c}>{c}</option>)}</select></div>
            <div style={{ display: "flex", gap: 8, marginTop: 18, justifyContent: "flex-end" }}>
              <button className="btn ghost" onClick={() => setShowBatch(false)}>Cancel</button>
              <button className="btn" onClick={applyBatch} disabled={!batchShift && !batchCampaign}>Apply</button>
            </div>
          </div>
        </div>
      )}

      {showGen && (
        <div onClick={() => setShowGen(false)} style={{ position: "fixed", inset: 0, background: "rgba(20,26,38,.5)", zIndex: 60, display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "48px 16px", overflowY: "auto" }}>
          <div onClick={(ev) => ev.stopPropagation()} style={{ background: "#fff", borderRadius: 14, maxWidth: 520, width: "100%", padding: 22, boxShadow: "0 20px 60px rgba(0,0,0,.3)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 17, fontWeight: 800 }}>Generate schedule</div>
              <button onClick={() => setShowGen(false)} style={{ border: "none", background: "none", fontSize: 20, color: "#8A93A6", cursor: "pointer" }}>{"\u00d7"}</button>
            </div>
            <div style={{ fontSize: 13, color: "#4A5264", lineHeight: 1.55, marginBottom: 14 }}>Fills the target month for each agent using their usual shift on each weekday (rest days included). Everything stays editable afterward.</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <div><div style={lbl}>Target month</div><select style={{ ...SEL, width: "100%" }} value={genMonth} onChange={(e) => setGenMonth(e.target.value)}>{MONTHS.map((m) => <option key={m}>{m}</option>)}</select></div>
              <div><div style={lbl}>Year</div><input style={{ ...SEL, width: "100%" }} value={genYear} onChange={(e) => setGenYear(e.target.value)} /></div>
              <div><div style={lbl}>Agents in campaign</div><select style={{ ...SEL, width: "100%" }} value={genCampaign} onChange={(e) => setGenCampaign(e.target.value)}><option value="all">All campaigns</option>{campaigns.map((c) => <option key={c}>{c}</option>)}</select></div>
              <div><div style={lbl}>Base pattern on</div><select style={{ ...SEL, width: "100%" }} value={genSource} onChange={(e) => setGenSource(e.target.value)}><option value="all">All history</option>{monthsAvailable.map((m) => <option key={m.key} value={m.key}>{m.key}</option>)}</select></div>
            </div>
            <label style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 14, fontSize: 13, color: "#3A4152", cursor: "pointer" }}>
              <input type="checkbox" checked={genSkip} onChange={(e) => setGenSkip(e.target.checked)} /> Skip agent-days that already have a row
            </label>
            <div style={{ display: "flex", gap: 8, marginTop: 18, justifyContent: "flex-end" }}>
              <button className="btn ghost" onClick={() => setShowGen(false)}>Cancel</button>
              <button className="btn" onClick={generate}>Generate</button>
            </div>
          </div>
        </div>
      )}

      {showNewAgent && (
        <div onClick={() => setShowNewAgent(false)} style={{ position: "fixed", inset: 0, background: "rgba(20,26,38,.5)", zIndex: 60, display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "48px 16px", overflowY: "auto" }}>
          <div onClick={(ev) => ev.stopPropagation()} style={{ background: "#fff", borderRadius: 14, maxWidth: 520, width: "100%", padding: 22, boxShadow: "0 20px 60px rgba(0,0,0,.3)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 17, fontWeight: 800 }}>New agent</div>
              <button onClick={() => setShowNewAgent(false)} style={{ border: "none", background: "none", fontSize: 20, color: "#8A93A6", cursor: "pointer" }}>{"\u00d7"}</button>
            </div>
            <div style={{ fontSize: 13, color: "#4A5264", lineHeight: 1.55, marginBottom: 14 }}>Creates a full month of rows for a brand-new agent (no history needed). Pick the working shift and tick which days are OFF — rest days can be any days of the week. Everything stays editable afterward.</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <div style={{ gridColumn: "1 / -1" }}><div style={lbl}>Agent name</div><input style={{ ...SEL, width: "100%" }} placeholder="Last, First" value={naName} onChange={(e) => setNaName(e.target.value)} /></div>
              <div><div style={lbl}>Campaign</div><input style={{ ...SEL, width: "100%" }} list="campaign-list" placeholder="Campaign" value={naCampaign} onChange={(e) => setNaCampaign(e.target.value)} /><datalist id="campaign-list">{campaigns.map((c) => <option key={c} value={c} />)}</datalist></div>
              <div><div style={lbl}>Target month</div><select style={{ ...SEL, width: "100%" }} value={naMonth} onChange={(e) => setNaMonth(e.target.value)}>{MONTHS.map((m) => <option key={m}>{m}</option>)}</select></div>
              <div><div style={lbl}>Year</div><input style={{ ...SEL, width: "100%" }} value={naYear} onChange={(e) => setNaYear(e.target.value)} /></div>
              <div style={{ gridColumn: "1 / -1" }}><div style={lbl}>Working shift</div><input style={{ ...SEL, width: "100%" }} list="shift-list" placeholder="e.g. 9:00AM-6:00PM" value={naShift} onChange={(e) => setNaShift(e.target.value)} /><datalist id="shift-list">{shiftOptions.map((s) => <option key={s} value={s} />)}</datalist></div>
              <div style={{ gridColumn: "1 / -1" }}>
                <div style={lbl}>Rest days (OFF)</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d, wd) => { const on = naRest.includes(wd); return (
                    <button key={wd} type="button" className="pilltab" onClick={() => setNaRest((p) => (on ? p.filter((x) => x !== wd) : [...p, wd]))} style={{ border: "1px solid " + (on ? "#2563EB" : "#D8DCE2"), background: on ? "#EAF1FF" : "#fff", color: on ? "#1D4ED8" : "#64748B", minWidth: 46 }}>{d}</button>
                  ); })}
                </div>
                <div style={{ fontSize: 11.5, color: "#8A93A6", marginTop: 6 }}>Ticked days are set to OFF; every other day uses the working shift.</div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 18, justifyContent: "flex-end" }}>
              <button className="btn ghost" onClick={() => setShowNewAgent(false)}>Cancel</button>
              <button className="btn" style={{ background: "#C08A2D", color: "#fff" }} onClick={addNewAgent}>Add agent</button>
            </div>
          </div>
        </div>
      )}

      {showSync && (
        <div onClick={() => setShowSync(false)} style={{ position: "fixed", inset: 0, background: "rgba(20,26,38,.5)", zIndex: 60, display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "40px 16px", overflowY: "auto" }}>
          <div onClick={(ev) => ev.stopPropagation()} style={{ background: "#fff", borderRadius: 14, maxWidth: 640, width: "100%", padding: 22, boxShadow: "0 20px 60px rgba(0,0,0,.3)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 17, fontWeight: 800 }}>Sync to Google Sheets</div>
              <button onClick={() => setShowSync(false)} style={{ border: "none", background: "none", fontSize: 20, color: "#8A93A6", cursor: "pointer" }}>{"\u00d7"}</button>
            </div>
            <div style={{ fontSize: 13, color: "#4A5264", lineHeight: 1.55 }}>Every change auto-syncs to an <b>Attendance</b> tab (plus a hidden <b>_state</b> tab used to load data back onto other devices).</div>
            <div style={{ marginTop: 14, fontWeight: 700, fontSize: 13 }}>Web app URL</div>
            <input style={{ width: "100%", padding: "9px 11px", border: "1px solid #D6D9E0", borderRadius: 8, fontSize: 13, marginTop: 5 }} placeholder="https://script.google.com/macros/s/\u2026/exec" value={gsDraft} onChange={(e) => setGsDraft(e.target.value)} />
            <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
              <button className="btn" style={{ background: "#2563EB", color: "#fff" }} onClick={saveGsUrl}>Save link</button>
              <button className="btn ghost" onClick={() => pushToSheet()} disabled={!gsUrl}>Push now</button>
              <button className="btn ghost" onClick={() => pullFromSheet()} disabled={!gsUrl}>Pull from Sheet</button>
              {gsUrl && <button className="btn ghost" onClick={() => { setGsDraft(""); setGsUrl(""); localStorage.removeItem("attendance:gsurl"); setSyncStatus("idle"); }}>Disconnect</button>}
            </div>
            <div style={{ marginTop: 18, fontWeight: 700, fontSize: 13 }}>One-time setup</div>
            <ol style={{ fontSize: 12.5, color: "#4A5264", lineHeight: 1.6, paddingLeft: 18, marginTop: 6 }}>
              <li>In your Google Sheet: <b>Extensions \u25b8 Apps Script</b>.</li>
              <li>Delete anything there, paste the script below, <b>Save</b>.</li>
              <li><b>Deploy \u25b8 New deployment \u25b8 Web app</b>. Execute as <b>Me</b>, access <b>Anyone</b>. Authorize.</li>
              <li>Copy the <b>Web app URL</b>, paste it above, then <b>Save link</b>.</li>
            </ol>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8 }}>
              <div style={{ fontSize: 12, color: "#8A93A6" }}>Apps Script code</div>
              <button className="btn ghost" style={{ padding: "5px 12px", fontSize: 12 }} onClick={() => { navigator.clipboard && navigator.clipboard.writeText(APPS_SCRIPT); flash("Script copied"); }}>Copy</button>
            </div>
            <textarea readOnly value={APPS_SCRIPT} style={{ width: "100%", height: 150, marginTop: 6, fontFamily: "ui-monospace, Menlo, Consolas, monospace", fontSize: 11, border: "1px solid #E6E8EC", borderRadius: 8, padding: 10, background: "#FAFBFC", whiteSpace: "pre", overflow: "auto" }} />
            <div style={{ marginTop: 10, fontSize: 11.5, color: "#8A93A6" }}>On a fresh device, use <b>Pull from Sheet</b> first. Auto-push only starts after you make an edit, so a blank browser won't wipe the sheet. \u201cAnyone\u201d access means anyone with the URL can write \u2014 keep it private.</div>
          </div>
        </div>
      )}

      {showAgent && (() => {
        const rowsA = dRows.filter((r) => (r.name || "\u2014") === showAgent.name && (r.campaign || "") === showAgent.campaign).slice().sort((a, b) => ((a.date || "") < (b.date || "") ? -1 : 1));
        const acc = blank(); rowsA.forEach((r) => addInto(acc, r));
        return (
          <div onClick={() => setShowAgent(null)} style={{ position: "fixed", inset: 0, background: "rgba(20,26,38,.5)", zIndex: 60, display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "40px 16px", overflowY: "auto" }}>
            <div onClick={(ev) => ev.stopPropagation()} style={{ background: "#fff", borderRadius: 12, maxWidth: 780, width: "100%", padding: 20, boxShadow: "0 20px 60px rgba(0,0,0,.3)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                <div><div style={{ fontSize: 17, fontWeight: 800 }}>{showAgent.name}</div><div style={{ fontSize: 12.5, color: "#6B7280", marginTop: 2 }}>{showAgent.campaign || "\u2014"}</div></div>
                <button onClick={() => setShowAgent(null)} style={{ border: "none", background: "none", fontSize: 20, color: "#8A93A6", cursor: "pointer" }}>{"\u00d7"}</button>
              </div>
              <div style={{ display: "flex", gap: 22, margin: "12px 0 14px", flexWrap: "wrap" }}>
                <div><div style={{ fontSize: 11, color: "#8A93A6", textTransform: "uppercase", fontWeight: 700 }}>Attendance</div><div className="mono" style={{ fontSize: 20, fontWeight: 800, color: rateColor(rate(acc)) }}>{pct(rate(acc))}</div></div>
                <div><div style={{ fontSize: 11, color: "#8A93A6", textTransform: "uppercase", fontWeight: 700 }}>Shrinkage</div><div className="mono" style={{ fontSize: 20, fontWeight: 800, color: "#4A5264" }}>{pct(shrink(acc))}</div></div>
                <div><div style={{ fontSize: 11, color: "#8A93A6", textTransform: "uppercase", fontWeight: 700 }}>Days</div><div className="mono" style={{ fontSize: 20, fontWeight: 800 }}>{acc.days}</div></div>
                <div><div style={{ fontSize: 11, color: "#8A93A6", textTransform: "uppercase", fontWeight: 700 }}>Loss min</div><div className="mono" style={{ fontSize: 20, fontWeight: 800, color: "#B23A3A" }}>{mins(loss(acc))}</div></div>
              </div>
              <div style={{ overflowX: "auto", maxHeight: "50vh" }}>
                <table className="grid">
                  <thead><tr><th className="left">Date</th><th>Day</th><th className="left">Shift</th><th>Absent</th><th>Tardy</th><th>Early Out</th><th>Leave</th><th>Minutes</th></tr></thead>
                  <tbody>
                    {rowsA.length === 0 ? (<tr><td colSpan={8} style={{ padding: "24px", color: "#8A93A6" }}>No rows for this agent in the current filter.</td></tr>) :
                      rowsA.map((r) => { const d = dOf(r); return (
                        <tr key={r.id}>
                          <td className="left" style={{ paddingLeft: 10 }}>{fmtMDY(r.date)}</td>
                          <td>{d.day}</td>
                          <td className="left" style={{ paddingLeft: 10, color: /^off$/i.test((r.shift || "").trim()) ? "#9AA1AC" : undefined }}>{r.shift || "\u2014"}</td>
                          <td className="mono">{num(r.absent) > 0 ? mins(num(r.absent)) : ""}</td>
                          <td className="mono">{num(r.tardy) > 0 ? mins(num(r.tardy)) : ""}</td>
                          <td className="mono">{num(r.earlyout) > 0 ? mins(num(r.earlyout)) : ""}</td>
                          <td className="mono">{num(r.leave) > 0 ? mins(num(r.leave)) : ""}</td>
                          <td className="mono">{d.minutes == null ? "\u2014" : d.minutes}</td>
                        </tr>
                      ); })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      })()}

      {toast && (
        <div style={{ position: "fixed", bottom: 22, left: "50%", transform: "translateX(-50%)", background: "#141A26", color: "#fff", padding: "11px 18px", borderRadius: 10, fontSize: 13.5, fontWeight: 600, boxShadow: "0 8px 24px rgba(0,0,0,.25)", zIndex: 50, display: "flex", alignItems: "center", gap: 14 }}>
          <span>{toast.msg}</span>
          {toast.fn && <button onClick={() => { toast.fn(); setToast(null); }} style={{ border: "1px solid #5A6070", background: "transparent", color: "#8FE3D6", fontWeight: 700, borderRadius: 7, padding: "4px 10px", cursor: "pointer", fontSize: 12.5 }}>{toast.actionLabel || "Undo"}</button>}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AttendanceApp />);

</script>
</body>
</html>
